<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Turist</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root { --bg:#0b1220; --panel:#131c31; --accent:#38bdf8; --text:#e2e8f0; --muted:#94a3b8; --border:#1f2a44; --card:#18233f; --success:#22c55e; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; min-height:100vh; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
.wrap { max-width:760px; margin:0 auto; padding:12px; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; }
h1 { color:var(--accent); font-size:1.4rem; font-weight:800; }
.lang-btn { background:var(--panel); border:1px solid var(--border); color:var(--text); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:.85rem; }
.offline-banner { background:#7f1d1d; color:#fecaca; padding:8px; border-radius:8px; font-size:.8rem; margin:8px 0; display:none; }
.filters { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
.filters input, .filters select { flex:1; min-width:120px; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:9px; font-size:.9rem; }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
.chip { background:var(--panel); border:1px solid var(--border); color:var(--text); padding:6px 12px; border-radius:999px; font-size:.8rem; cursor:pointer; }
.chip.active { background:var(--accent); color:#0b1220; border-color:var(--accent); }
#map { height:340px; border-radius:12px; overflow:hidden; margin:10px 0; border:1px solid var(--border); }
.cards { display:grid; grid-template-columns:1fr; gap:10px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; cursor:pointer; transition:transform .15s; }
.card:active { transform:scale(.98); }
.card img { width:100%; height:170px; object-fit:cover; background:#1f2a44; }
.card-body { padding:10px; }
.card-title { color:var(--accent); font-weight:700; font-size:1.05rem; }
.card-meta { color:var(--muted); font-size:.8rem; margin:4px 0; }
.card-desc { font-size:.9rem; margin:6px 0; line-height:1.4; }
.tag { display:inline-block; background:rgba(56,189,248,.12); border:1px solid rgba(56,189,248,.3); color:var(--accent); padding:2px 8px; border-radius:999px; font-size:.7rem; margin-right:4px; }
.budget { display:inline-block; padding:2px 8px; border-radius:999px; font-size:.7rem; font-weight:700; }
.budget.low { background:rgba(34,197,94,.15); color:#4ade80; border:1px solid rgba(34,197,94,.3); }
.budget.mid { background:rgba(250,204,21,.15); color:#facc15; border:1px solid rgba(250,204,21,.3); }
.budget.high { background:rgba(239,68,68,.15); color:#f87171; border:1px solid rgba(239,68,68,.3); }
.detail { position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; align-items:center; justify-content:center; z-index:1000; padding:12px; backdrop-filter:blur(4px); }
.detail-box { background:var(--panel); border:1px solid var(--border); border-radius:14px; max-width:560px; width:100%; max-height:92vh; overflow:auto; padding:14px; }
.detail-box img { width:100%; height:220px; object-fit:cover; border-radius:10px; margin-bottom:8px; background:#1f2a44; }
.detail-title { color:var(--accent); font-size:1.3rem; font-weight:700; margin-bottom:4px; }
.detail-row { margin:6px 0; font-size:.9rem; line-height:1.4; }
.detail-row b { color:var(--muted); }
.btn { display:inline-block; background:var(--accent); color:#0b1220; padding:9px 14px; border-radius:8px; text-decoration:none; font-weight:700; font-size:.85rem; margin-top:8px; margin-right:6px; border:none; cursor:pointer; }
.btn.secondary { background:var(--panel); color:var(--text); border:1px solid var(--border); }
.close-btn { float:right; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:4px 10px; cursor:pointer; }
.empty { text-align:center; color:var(--muted); padding:24px; }
@media (min-width:600px){ .cards { grid-template-columns:1fr 1fr; } }
</style>
</head>

function applyLang() {
  document.documentElement.lang = lang;
  document.getElementById("title").textContent = t("title");
  document.getElementById("search").placeholder = t("search");
  const citySel = document.getElementById("cityFilter");
  citySel.options[0].text = t("allCities");
  const catSel = document.getElementById("catFilter");
  catSel.options[0].text = t("allCats");
  document.getElementById("langBtn").textContent = lang === "tr" ? "EN" : "TR";
  render();
}

function toggleLang() {
  lang = lang === "tr" ? "en" : "tr";
  localStorage.setItem("ttg_lang", lang);
  localStorage.setItem("ttg_lang_set", "1");
  applyLang();
}

function filteredPlaces() {
  const q = document.getElementById("search").value.toLowerCase();
  const city = document.getElementById("cityFilter").value;
  const cat = document.getElementById("catFilter").value;
  return PLACES.filter(p => {
    const name = p.name[lang].toLowerCase();
    if (q && !name.includes(q) && !p.desc[lang].toLowerCase().includes(q) && !p.highlights[lang].toLowerCase().includes(q)) return false;
    if (city && p.city !== city) return false;
    if (cat && p.cat !== cat) return false;
    return true;
  });
}

  if (list.length === 0) { cards.innerHTML = '<div class="empty">Sonuç bulunamadı / No results</div>'; return; }
  list.forEach(p => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <img src="${p.img}" alt="${p.name[lang]}" loading="lazy" onerror="this.style.display='none'" />
      <div class="card-body">
        <div class="card-title">${p.name[lang]}</div>
        <div class="card-meta">${cityNames[lang][p.city]} · ${catNames[lang][p.cat]}</div>
        <p class="card-desc">${p.desc[lang]}</p>
        <div>
          <span class="tag">${t("bestTime")}: ${p.best[lang]}</span>
          <span class="budget ${p.budget}">${t("budget")}: ${I18N[lang].budgetLabels[p.budget]}</span>
        </div>
        <button class="btn" style="margin-top:6px" onclick="showDetail(${p.id})">Detay</button>
      </div>`;
    cards.appendChild(div);
  });
}

function renderMap(list) {
  if (!map) return;
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  const bounds = [];
  list.forEach(p => {
    const m = L.marker([p.lat, p.lng]).addTo(map);
    m.bindPopup(`<b>${p.name[lang]}</b><br/>${p.desc[lang]}`);
    m.on("click", () => showDetail(p.id));
    markers.push(m);
    bounds.push([p.lat, p.lng]);
  });
  if (bounds.length) map.fitBounds(bounds, { padding: [20,20], maxZoom: 11 });
}

function render() {
  const list = filteredPlaces();
  renderCards(list);
  renderMap(list);
  renderChips();
}

function renderChips() {
  const chips = document.getElementById("chips");
  chips.innerHTML = "";
  const cats = ["historical","nature","beach","culture"];
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = catNames[lang][c];
    b.onclick = () => {
      const sel = document.getElementById("catFilter");
      sel.value = sel.value === c ? "" : c;
      render();
    };
    if (document.getElementById("catFilter").value === c) b.classList.add("active");
    chips.appendChild(b);
  });
}

function showDetail(id) {
  const p = PLACES.find(x => x.id === id);
  if (!p) return;
  const box = document.getElementById("detailBox");
  box.innerHTML = `
    <button class="close-btn" onclick="closeDetail()">×</button>
    <img src="${p.img}" alt="${p.name[lang]}" onerror="this.style.display='none'" />
    <div class="detail-title">${p.name[lang]}</div>
    <div class="detail-row"><b>${t("coords")}:</b> ${p.lat}, ${p.lng}</div>
    <div class="detail-row"><b>${t("bestTime")}:</b> ${p.best[lang]}</div>
    <div class="detail-row"><b>${t("tips")}:</b> ${p.tips[lang]}</div>
    <div class="detail-row"><b>${t("highlights")}:</b> ${p.highlights[lang]}</div>
    <div class="detail-row"><b>${t("budget")}:</b> ${I18N[lang].budgetLabels[p.budget]}</div>
    <p class="detail-row">${p.desc[lang]}</p>
    <a class="btn" href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank">${t("openMaps")}</a>
    <button class="btn secondary" onclick="closeDetail()">Kapat / Close</button>
  `;
  document.getElementById("detail").style.display = "flex";
}

function closeDetail() { document.getElementById("detail").style.display = "none"; }

function populateFilters() {
  const citySel = document.getElementById("cityFilter");
  const cities = [...new Set(PLACES.map(p=>p.city))];
  cities.forEach(c => {
    const o = document.createElement("option");
    o.value = c; o.textContent = I18N[lang].cities[c];
    citySel.appendChild(o);
  });
  const catSel = document.getElementById("catFilter");
  Object.keys(I18N[lang].cats).forEach(c => {
    const o = document.createElement("option");
    o.value = c; o.textContent = I18N[lang].cats[c];
    catSel.appendChild(o);
  });
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("cityFilter").addEventListener("change", render);
document.getElementById("catFilter").addEventListener("change", render);
document.getElementById("detail").addEventListener("click", (e) => { if (e.target.id === "detail") closeDetail(); });

populateFilters();
applyLang();
map = L.map("map").setView([39,35], 6);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "&copy; OpenStreetMap" }).addTo(map);
render();

if (!navigator.onLine) {
  const b = document.getElementById("offlineBanner");
  b.textContent = t("offline");
  b.style.display = "block";
}
</script>
</body>
</html>
